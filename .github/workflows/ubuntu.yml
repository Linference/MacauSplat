name: Ubuntu 24.04 Alpha

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-alpha-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Read package version
        id: package
        run: |
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Ubuntu dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential colmap curl ffmpeg file libvulkan1 mesa-vulkan-drivers \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests and build
        run: |
          npm run verify:telemetry:release
          npm test
          npm run build

      - name: Verify license metadata and mappings
        run: npm run verify:licenses

      # Linux uses the system ffmpeg/ffprobe/colmap plus the pinned Brush archive.
      # `npm run setup:engines` / `verify:engines` dispatch to the *macOS* bash
      # scripts on darwin/linux alike (see scripts/engine-command.mjs) and those
      # hard-fail off Apple Silicon, so the Linux variants must be called
      # explicitly here.
      - name: Install and verify bundled Brush
        run: |
          npm run setup:engines:linux
          npm run verify:engines:linux

      # REQUIRED before `tauri build`: bundle.externalBin declares
      # binaries/splatstudio, tauri-build fails hard when the staged CLI is
      # missing, and the file is gitignored. Keep this before the Rust/build
      # steps. Note that tauri.conf.json's beforeBuildCommand is
      # `npm run build:bundle:linux`, which does NOT stage the CLI.
      - name: Stage CLI for externalBin
        run: npm run stage:cli

      - name: Rust formatting, tests, and clippy
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: FFmpeg CLI integration
        run: |
          ffmpeg -y -hide_banner -loglevel error \
            -f lavfi -i testsrc=size=320x240:rate=10 -t 2 \
            -c:v mpeg4 /tmp/ooosplat-ci.mp4
          cargo run --manifest-path src-tauri/Cargo.toml --bin splatstudio -- \
            probe /tmp/ooosplat-ci.mp4
          cargo run --manifest-path src-tauri/Cargo.toml --bin splatstudio -- \
            extract /tmp/ooosplat-ci.mp4 /tmp/ooosplat-ci-frames --quality fast
          test "$(find /tmp/ooosplat-ci-frames -maxdepth 1 -name '*.jpg' | wc -l)" -gt 0

      - name: Build Ubuntu DEB package
        run: npm run tauri -- build --bundles deb

      - name: Verify Ubuntu DEB package
        run: |
          package="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          test -s "$package"
          expected_version="${{ steps.package.outputs.version }}"
          actual_version="$(dpkg-deb --field "$package" Version)"
          test "$(dpkg-deb --field "$package" Architecture)" = "amd64"
          test "$actual_version" = "$expected_version"
          dependencies="$(dpkg-deb --field "$package" Depends)"
          grep -Eq '(^|, )ffmpeg([ ,]|$)' <<<"$dependencies"
          grep -Eq '(^|, )colmap([ ,]|$)' <<<"$dependencies"
          extracted="$(mktemp -d)"
          trap 'rm -rf -- "$extracted"' EXIT
          dpkg-deb --extract "$package" "$extracted"
          test -n "$(find "$extracted" -type f -name ooo-splat -perm -111 -print -quit)"
          test -n "$(find "$extracted" -type f -path '*/engines/linux/brush/brush_app' -perm -111 -print -quit)"
          test -n "$(find "$extracted" -type f -path '*/engines/manifest.linux.json' -print -quit)"
          # bundle.externalBin declares binaries/splatstudio, so the staged CLI
          # must actually land inside the deb next to the main executable.
          test -n "$(find "$extracted" -type f -name splatstudio -perm -111 -print -quit)"
          dpkg-deb --info "$package"

      - name: Package downloadable files
        run: |
          package="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          version="${{ steps.package.outputs.version }}"
          filename="MacauSplat-${version}-x64-linux.deb"
          mkdir -p dist-artifacts
          cp "$package" "dist-artifacts/$filename"
          (cd dist-artifacts && sha256sum "$filename" > SHA256SUMS.txt)

      - name: Upload Ubuntu installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: MacauSplat-${{ steps.package.outputs.version }}-x64-linux
          path: dist-artifacts/
          if-no-files-found: error
          retention-days: 14
